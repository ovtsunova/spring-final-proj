<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/user-layout :: layout(~{::section})}">
<section>
    <h1>Оформление заказа</h1>

    <table>
        <tr>
            <th>Товар</th>
            <th>Цена</th>
            <th>Количество</th>
        </tr>
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.product.productName}"></td>
            <td th:text="${item.product.price}"></td>
            <td th:text="${item.quantity}"></td>
        </tr>
    </table>

    <h3>Итого: <span th:text="${total}"></span></h3>

    <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post">
        <label>Адрес доставки:</label>
        <input type="text" th:field="*{deliveryAddress}">

        <label>Комментарий:</label>
        <textarea th:field="*{comment}"></textarea>

        <button class="btn btn-success" type="submit">Подтвердить заказ</button>
        <a class="btn btn-secondary" th:href="@{/cart}">Назад в корзину</a>
    </form>
</section>
</body>
</html>
