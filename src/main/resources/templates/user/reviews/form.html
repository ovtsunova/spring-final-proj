<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/user-layout :: layout(~{::section})}">
<section>
    <h1>Отзыв</h1>

    <p><strong>Товар:</strong> <span th:text="${product.productName}"></span></p>

    <form th:action="${review.idReview == null} ? @{/my-reviews/new/{productId}(productId=${product.idProduct})} : @{/my-reviews/{id}/edit(id=${review.idReview})}"
          th:object="${review}"
          method="post">

        <label>Оценка:</label>
        <input type="number" min="1" max="5" th:field="*{rating}">
        <div class="field-error" th:errors="*{rating}"></div>

        <label>Комментарий:</label>
        <textarea th:field="*{comment}"></textarea>
        <div class="field-error" th:errors="*{comment}"></div>

        <label>Дата отзыва:</label>
        <input type="date" th:field="*{reviewDate}">
        <div class="field-error" th:errors="*{reviewDate}"></div>

        <button class="btn btn-success" type="submit">Сохранить</button>
        <a class="btn btn-secondary" th:href="@{/my-reviews}">Назад</a>
    </form>
</section>
</body>
</html>
