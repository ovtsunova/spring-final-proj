<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/user-layout :: layout(~{::section})}">
<section>
    <h1>Заказ</h1>

    <p><strong>ID:</strong> <span th:text="${order.idOrder}"></span></p>
    <p><strong>Дата:</strong> <span th:text="${order.orderDate}"></span></p>
    <p><strong>Статус:</strong> <span th:text="${order.orderStatus}"></span></p>
    <p><strong>Сумма:</strong> <span th:text="${order.totalAmount}"></span></p>
    <p><strong>Адрес доставки:</strong> <span th:text="${order.deliveryAddress}"></span></p>
    <p><strong>Комментарий:</strong> <span th:text="${order.comment}"></span></p>

    <a class="btn btn-secondary" th:href="@{/my-orders}">Назад</a>
</section>
</body>
</html>
