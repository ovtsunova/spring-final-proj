<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1>Бренды</h1>

    <a class="btn btn-success" th:href="@{/admin/brands/new}">Добавить бренд</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Страна</th>
            <th>Действия</th>
        </tr>
        <tr th:each="brand : ${brands}">
            <td th:text="${brand.idBrand}"></td>
            <td th:text="${brand.brandName}"></td>
            <td th:text="${brand.country}"></td>
            <td class="actions">
                <a class="btn btn-primary" th:href="@{/admin/brands/{id}(id=${brand.idBrand})}">Просмотр</a>
                <a class="btn btn-secondary" th:href="@{/admin/brands/{id}/edit(id=${brand.idBrand})}">Редактировать</a>
                <form th:action="@{/admin/brands/{id}/delete(id=${brand.idBrand})}" method="post" style="display:inline;">
                    <button class="btn btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</section>
</body>
</html>
