<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Просмотр бренда</title>
</head>
<body>
<h1>Просмотр бренда</h1>

<p><b>ID:</b> <span th:text="${brand.idBrand}"></span></p>

<a th:href="@{/admin/brands}">Назад</a>

</body>
</html>
