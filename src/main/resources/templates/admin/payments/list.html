<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1>Оплаты</h1>

    <a class="btn btn-success" th:href="@{/admin/payments/new}">Добавить оплату</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Сумма</th>
            <th>Способ оплаты</th>
            <th>Статус</th>
            <th>Заказ</th>
            <th>Действия</th>
        </tr>
        <tr th:each="payment : ${payments}">
            <td th:text="${payment.idPayment}"></td>
            <td th:text="${payment.amount}"></td>
            <td th:text="${payment.paymentMethod}"></td>
            <td th:text="${payment.paymentStatus}"></td>
            <td th:text="${payment.orderInfo != null ? payment.orderInfo.idOrder : '-'}"></td>
            <td class="actions">
                <a class="btn btn-primary" th:href="@{/admin/payments/{id}(id=${payment.idPayment})}">Просмотр</a>
                <a class="btn btn-secondary" th:href="@{/admin/payments/{id}/edit(id=${payment.idPayment})}">Редактировать</a>
                <form th:action="@{/admin/payments/{id}/delete(id=${payment.idPayment})}" method="post" style="display:inline;">
                    <button class="btn btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</section>
</body>
</html>
