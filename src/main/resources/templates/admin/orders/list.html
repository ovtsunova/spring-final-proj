<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1>Заказы</h1>

    <a class="btn btn-success" th:href="@{/admin/orders/new}">Добавить заказ</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Дата</th>
            <th>Статус</th>
            <th>Сумма</th>
            <th>Клиент</th>
            <th>Действия</th>
        </tr>
        <tr th:each="order : ${orders}">
            <td th:text="${order.idOrder}"></td>
            <td th:text="${order.orderDate}"></td>
            <td th:text="${order.orderStatus}"></td>
            <td th:text="${order.totalAmount}"></td>
            <td th:text="${order.customer != null ? order.customer.lastName + ' ' + order.customer.firstName : '-'}"></td>
            <td class="actions">
                <a class="btn btn-primary" th:href="@{/admin/orders/{id}(id=${order.idOrder})}">Просмотр</a>
                <a class="btn btn-secondary" th:href="@{/admin/orders/{id}/edit(id=${order.idOrder})}">Редактировать</a>
                <form th:action="@{/admin/orders/{id}/delete(id=${order.idOrder})}" method="post" style="display:inline;">
                    <button class="btn btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</section>
</body>
</html>
