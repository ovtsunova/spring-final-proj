<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1 th:text="${formTitle}"></h1>

    <form th:action="${order.idOrder == null} ? @{/admin/orders} : @{/admin/orders/{id}(id=${order.idOrder})}"
          th:object="${order}" method="post">

        <label>Дата заказа:</label>
        <input type="text" th:field="*{orderDate}">
        <div class="field-error" th:errors="*{orderDate}"></div>

        <label>Статус заказа:</label>
        <input type="text" th:field="*{orderStatus}">
        <div class="field-error" th:errors="*{orderStatus}"></div>

        <label>Сумма заказа:</label>
        <input type="number" step="0.01" th:field="*{totalAmount}">
        <div class="field-error" th:errors="*{totalAmount}"></div>

        <label>Адрес доставки:</label>
        <input type="text" th:field="*{deliveryAddress}">
        <div class="field-error" th:errors="*{deliveryAddress}"></div>

        <label>Комментарий:</label>
        <textarea th:field="*{comment}"></textarea>
        <div class="field-error" th:errors="*{comment}"></div>

        <label>Клиент:</label>
        <select name="customerId">
            <option th:each="customer : ${customers}"
                    th:value="${customer.idCustomer}"
                    th:text="${customer.lastName + ' ' + customer.firstName}"
                    th:selected="${order.customer != null and order.customer.idCustomer == customer.idCustomer}">
            </option>
        </select>

        <button class="btn btn-success" type="submit">Сохранить</button>
        <a class="btn btn-secondary" th:href="@{/admin/orders}">Назад</a>
    </form>
</section>
</body>
</html>
