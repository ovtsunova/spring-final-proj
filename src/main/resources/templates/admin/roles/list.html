<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1>Роли</h1>

    <a class="btn btn-success" th:href="@{/admin/roles/new}">Добавить роль</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Название роли</th>
            <th>Действия</th>
        </tr>
        <tr th:each="role : ${roles}">
            <td th:text="${role.idRole}"></td>
            <td th:text="${role.roleLabel}"></td>
            <td class="actions">
                <a class="btn btn-primary" th:href="@{/admin/roles/{id}(id=${role.idRole})}">Просмотр</a>
                <a class="btn btn-secondary" th:href="@{/admin/roles/{id}/edit(id=${role.idRole})}">Редактировать</a>
                <form th:action="@{/admin/roles/{id}/delete(id=${role.idRole})}" method="post" style="display:inline;">
                    <button class="btn btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</section>
</body>
</html>
