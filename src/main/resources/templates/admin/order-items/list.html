<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1>Позиции заказов</h1>

    <a class="btn btn-success" th:href="@{/admin/order-items/new}">Добавить позицию</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Заказ</th>
            <th>Товар</th>
            <th>Количество</th>
            <th>Цена</th>
            <th>Действия</th>
        </tr>
        <tr th:each="item : ${orderItems}">
            <td th:text="${item.idOrderItem}"></td>
            <td th:text="${item.orderInfo != null ? item.orderInfo.idOrder : '-'}"></td>
            <td th:text="${item.product != null ? item.product.productName : '-'}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.itemPrice}"></td>
            <td class="actions">
                <a class="btn btn-primary" th:href="@{/admin/order-items/{id}(id=${item.idOrderItem})}">Просмотр</a>
                <a class="btn btn-secondary" th:href="@{/admin/order-items/{id}/edit(id=${item.idOrderItem})}">Редактировать</a>
                <form th:action="@{/admin/order-items/{id}/delete(id=${item.idOrderItem})}" method="post" style="display:inline;">
                    <button class="btn btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</section>
</body>
</html>
