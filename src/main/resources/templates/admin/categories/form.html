<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1 th:text="${formTitle}"></h1>

    <form th:action="${category.idCategory == null} ? @{/admin/categories} : @{/admin/categories/{id}(id=${category.idCategory})}"
          th:object="${category}"
          method="post">

        <label>Название:</label>
        <input type="text" th:field="*{categoryName}">
        <div class="field-error" th:errors="*{categoryName}"></div>

        <label>Описание:</label>
        <textarea th:field="*{description}"></textarea>
        <div class="field-error" th:errors="*{description}"></div>

        <button class="btn btn-success" type="submit">Сохранить</button>
        <a class="btn btn-secondary" th:href="@{/admin/categories}">Назад</a>
    </form>
</section>
</body>
</html>
