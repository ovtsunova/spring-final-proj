<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/admin-layout :: layout(~{::section})}">
<section>
    <h1>Панель администратора</h1>
    <p>Добро пожаловать в административную панель.</p>
    <p>Выберите нужный раздел в боковом меню.</p>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-top:20px;">
        <a class="btn btn-primary" th:href="@{/admin/products}">Товары</a>
        <a class="btn btn-primary" th:href="@{/admin/categories}">Категории</a>
        <a class="btn btn-primary" th:href="@{/admin/brands}">Бренды</a>
        <a class="btn btn-primary" th:href="@{/admin/customers}">Клиенты</a>
        <a class="btn btn-primary" th:href="@{/admin/orders}">Заказы</a>
        <a class="btn btn-primary" th:href="@{/admin/order-items}">Позиции заказов</a>
        <a class="btn btn-primary" th:href="@{/admin/reviews}">Отзывы</a>
        <a class="btn btn-primary" th:href="@{/admin/payments}">Оплаты</a>
        <a class="btn btn-primary" th:href="@{/admin/accounts}">Аккаунты</a>
        <a class="btn btn-primary" th:href="@{/admin/roles}">Роли</a>
    </div>
</section>
</body>
</html>
