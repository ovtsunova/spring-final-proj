<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/staff-layout :: layout(~{::section})}">
<section>
    <h1>Просмотр товара</h1>

    <p><strong>ID:</strong> <span th:text="${product.idProduct}"></span></p>
    <p>
        <img class="product-preview" th:src="${product.imageUrl}" alt="Изображение товара">
    </p>
    <p><strong>Название:</strong> <span th:text="${product.productName}"></span></p>
    <p><strong>Модель:</strong> <span th:text="${product.model}"></span></p>
    <p><strong>Описание:</strong> <span th:text="${product.description}"></span></p>
    <p><strong>Цена:</strong> <span th:text="${product.price}"></span></p>
    <p><strong>Количество:</strong> <span th:text="${product.stockQuantity}"></span></p>
    <p><strong>Гарантия:</strong> <span th:text="${product.warrantyMonths}"></span></p>
    <p><strong>Цвет:</strong> <span th:text="${product.color}"></span></p>
    <p><strong>Статус:</strong> <span th:text="${product.availabilityStatus}"></span></p>
    <p><strong>Категория:</strong> <span th:text="${product.category != null ? product.category.categoryName : '-'}"></span></p>
    <p><strong>Бренд:</strong> <span th:text="${product.brand != null ? product.brand.brandName : '-'}"></span></p>

    <a class="btn btn-secondary" th:href="@{/staff/products}">Назад</a>
    <a class="btn btn-primary" th:href="@{/staff/products/{id}/edit(id=${product.idProduct})}">Редактировать</a>
</section>
</body>
</html>
