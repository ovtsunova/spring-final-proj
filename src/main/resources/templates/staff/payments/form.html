<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/staff-layout :: layout(~{::section})}">
<section>
    <h1 th:text="${formTitle}"></h1>

    <form th:action="${payment.idPayment == null} ? @{/staff/payments} : @{/staff/payments/{id}(id=${payment.idPayment})}"
          th:object="${payment}" method="post">

        <label>Сумма:</label>
        <input type="number" step="0.01" th:field="*{amount}">
        <div class="field-error" th:errors="*{amount}"></div>

        <label>Способ оплаты:</label>
        <input type="text" th:field="*{paymentMethod}">
        <div class="field-error" th:errors="*{paymentMethod}"></div>

        <label>Статус оплаты:</label>
        <input type="text" th:field="*{paymentStatus}">
        <div class="field-error" th:errors="*{paymentStatus}"></div>

        <label>Дата оплаты:</label>
        <input type="text" th:field="*{paymentDate}">
        <div class="field-error" th:errors="*{paymentDate}"></div>

        <label>Заказ:</label>
        <select name="orderId">
            <option th:each="order : ${orders}"
                    th:value="${order.idOrder}"
                    th:text="${'Заказ #' + order.idOrder}"
                    th:selected="${payment.orderInfo != null and payment.orderInfo.idOrder == order.idOrder}">
            </option>
        </select>

        <button class="btn btn-success" type="submit">Сохранить</button>
        <a class="btn btn-secondary" th:href="@{/staff/payments}">Назад</a>
    </form>
</section>
</body>
</html>
