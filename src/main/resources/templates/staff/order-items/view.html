<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/staff-layout :: layout(~{::section})}">
<section>
    <h1>Просмотр позиции заказа</h1>

    <p><strong>ID:</strong> <span th:text="${orderItem.idOrderItem}"></span></p>
    <p><strong>Заказ:</strong> <span th:text="${orderItem.orderInfo.idOrder}"></span></p>
    <p><strong>Товар:</strong> <span th:text="${orderItem.product.productName}"></span></p>
    <p><strong>Количество:</strong> <span th:text="${orderItem.quantity}"></span></p>
    <p><strong>Цена:</strong> <span th:text="${orderItem.itemPrice}"></span></p>

    <a class="btn btn-secondary" th:href="@{/staff/order-items}">Назад</a>
    <a class="btn btn-primary" th:href="@{/staff/order-items/{id}/edit(id=${orderItem.idOrderItem})}">Редактировать</a>
</section>
</body>
</html>
