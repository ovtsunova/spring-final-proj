<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/staff-layout :: layout(~{::section})}">
<section>
    <h1 th:text="${formTitle}"></h1>

    <form th:action="${orderItem.idOrderItem == null} ? @{/staff/order-items} : @{/staff/order-items/{id}(id=${orderItem.idOrderItem})}"
          th:object="${orderItem}" method="post">

        <label>Количество:</label>
        <input type="number" th:field="*{quantity}">
        <div class="field-error" th:errors="*{quantity}"></div>

        <label>Цена:</label>
        <input type="number" step="0.01" th:field="*{itemPrice}">
        <div class="field-error" th:errors="*{itemPrice}"></div>

        <label>Заказ:</label>
        <select name="orderId">
            <option th:each="order : ${orders}"
                    th:value="${order.idOrder}"
                    th:text="${'Заказ #' + order.idOrder}"
                    th:selected="${orderItem.orderInfo != null and orderItem.orderInfo.idOrder == order.idOrder}">
            </option>
        </select>

        <label>Товар:</label>
        <select name="productId">
            <option th:each="product : ${products}"
                    th:value="${product.idProduct}"
                    th:text="${product.productName}"
                    th:selected="${orderItem.product != null and orderItem.product.idProduct == product.idProduct}">
            </option>
        </select>

        <button class="btn btn-success" type="submit">Сохранить</button>
        <a class="btn btn-secondary" th:href="@{/staff/order-items}">Назад</a>
    </form>
</section>
</body>
</html>
