<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/staff-layout :: layout(~{::section})}">
<section>
    <h1>Отзывы</h1>

    <a class="btn btn-success" th:href="@{/staff/reviews/new}">Добавить отзыв</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Клиент</th>
            <th>Товар</th>
            <th>Оценка</th>
            <th>Дата</th>
            <th>Действия</th>
        </tr>
        <tr th:each="review : ${reviews}">
            <td th:text="${review.idReview}"></td>
            <td th:text="${review.customer != null ? review.customer.lastName + ' ' + review.customer.firstName : '-'}"></td>
            <td th:text="${review.product != null ? review.product.productName : '-'}"></td>
            <td th:text="${review.rating}"></td>
            <td th:text="${review.reviewDate}"></td>
            <td class="actions">
                <a class="btn btn-primary" th:href="@{/staff/reviews/{id}(id=${review.idReview})}">Просмотр</a>
                <a class="btn btn-secondary" th:href="@{/staff/reviews/{id}/edit(id=${review.idReview})}">Редактировать</a>
                <form th:action="@{/staff/reviews/{id}/delete(id=${review.idReview})}" method="post" style="display:inline;">
                    <button class="btn btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</section>
</body>
</html>
