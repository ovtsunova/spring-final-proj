<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{fragments/staff-layout :: layout(~{::section})}">
<section>
    <h1>Просмотр отзыва</h1>

    <p><strong>ID:</strong> <span th:text="${review.idReview}"></span></p>
    <p><strong>Клиент:</strong> <span th:text="${review.customer.lastName + ' ' + review.customer.firstName}"></span></p>
    <p><strong>Товар:</strong> <span th:text="${review.product.productName}"></span></p>
    <p><strong>Оценка:</strong> <span th:text="${review.rating}"></span></p>
    <p><strong>Комментарий:</strong> <span th:text="${review.comment}"></span></p>
    <p><strong>Дата:</strong> <span th:text="${review.reviewDate}"></span></p>

    <a class="btn btn-secondary" th:href="@{/staff/reviews}">Назад</a>
    <a class="btn btn-primary" th:href="@{/staff/reviews/{id}/edit(id=${review.idReview})}">Редактировать</a>
</section>
</body>
</html>
