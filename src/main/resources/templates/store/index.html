<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Магазин бытовой техники</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        .top-links {
            margin-top: 10px;
        }

        .top-links a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        .container {
            padding: 30px 40px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h3 {
            margin: 14px 0 8px;
        }

        .product-card p {
            margin: 6px 0;
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
<header>
    <h1>Магазин бытовой техники</h1>
    <div class="top-links">
        <a th:href="@{/login}">Вход</a>
        <a th:href="@{/register}">Регистрация</a>
    </div>
</header>

<div class="container">
    <h2>Каталог товаров</h2>

    <div class="products-grid">
        <div class="product-card" th:each="product : ${products}">
            <img th:src="${product.imageUrl}" alt="Товар">
            <h3 th:text="${product.productName}"></h3>
            <p><strong>Модель:</strong> <span th:text="${product.model}"></span></p>
            <p><strong>Цена:</strong> <span th:text="${product.price}"></span></p>
            <p><strong>Категория:</strong> <span th:text="${product.category.categoryName}"></span></p>
            <p><strong>Бренд:</strong> <span th:text="${product.brand.brandName}"></span></p>

            <a class="btn" th:href="@{/products/{id}(id=${product.idProduct})}">Подробнее</a>
        </div>
    </div>
</div>
</body>
</html>
