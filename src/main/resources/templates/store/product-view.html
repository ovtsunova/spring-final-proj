<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Карточка товара</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="page-container">
    <div class="card product-detail-card">

        <div class="product-wrapper">
            <div class="product-image">
                <img th:src="${product.imageUrl}" alt="Товар">
            </div>

            <div class="product-info">
                <h1 th:text="${product.productName}"></h1>

                <p>
                    <strong>Модель:</strong>
                    <span th:text="${product.model}"></span>
                </p>

                <p>
                    <strong>Описание:</strong>
                    <span th:text="${product.description}"></span>
                </p>

                <p>
                    <strong>Цена:</strong>
                    <span th:text="${product.price}"></span>
                </p>

                <p>
                    <strong>Количество на складе:</strong>
                    <span th:text="${product.stockQuantity}"></span>
                </p>

                <p>
                    <strong>Гарантия:</strong>
                    <span th:text="${product.warrantyMonths}"></span>
                </p>

                <p>
                    <strong>Цвет:</strong>
                    <span th:text="${product.color}"></span>
                </p>

                <p>
                    <strong>Категория:</strong>
                    <span th:text="${product.category.categoryName}"></span>
                </p>

                <p>
                    <strong>Бренд:</strong>
                    <span th:text="${product.brand.brandName}"></span>
                </p>

                <div class="product-actions">
                    <a class="btn" th:href="@{/my-reviews/new/{productId}(productId=${product.idProduct})}">
                        Оставить отзыв
                    </a>

                    <a class="btn btn-secondary" th:href="@{/}">
                        Назад в каталог
                    </a>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
