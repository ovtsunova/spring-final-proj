<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Вход в систему</h1>

        <div class="error" th:if="${param.error}">
            Неверный логин или пароль.
        </div>

        <div class="success" th:if="${param.logout}">
            Вы вышли из системы.
        </div>

        <div class="success" th:if="${param.registered}">
            Регистрация прошла успешно. Теперь войдите в систему.
        </div>

        <form class="auth-form" th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Логин:</label>
                <input type="text" name="username" id="username" required class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" name="password" id="password" required class="form-control">
            </div>

            <div class="auth-actions">
                <button type="submit" class="btn-primary">Войти</button>
            </div>
        </form>

        <p style="margin-top:18px;text-align:center;">
            <a th:href="@{/register}" class="link">Зарегистрироваться</a>
        </p>
    </div>
</body>
</html>
